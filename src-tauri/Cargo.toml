[package]
name = "micstream"
version = "0.1.0"
description = "Ultra-Low Latency Cross-Platform LAN Microphone Streaming"
authors = ["Goncalo"]
edition = "2021"

[lib]
name = "micstream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "micstream"
path = "src/main.rs"

[[bin]]
name = "audio_prototype"
path = "src/bin/audio_prototype.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
opus = "0.4"
rubato = "0.16"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.13"
byteorder = "1.5"
ringbuf = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
